name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  pull_request:
    # Documentation alone needs no build: Prettier and the voice-table (docs/voices.md)
    # check run in the commit hook.
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  workflow_dispatch:
  # Monthly, so a quiet repository still notices toolchain, runner or advisory drift.
  schedule:
    - cron: "41 6 1 * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run typecheck
      - name: Lint (Obsidian review rules)
        run: bun run lint
      - name: Formatting
        run: bun run format:check
      - name: Tests
        run: bun run test
      - name: Python tests
        run: bun run test:python
      - name: Build
        run: bun run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: |
            main.js
            manifest.json
            styles.css

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${GITLEAKS_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "${asset}" gitleaks
      - name: Scan every commit
        run: ./gitleaks git --redact --no-banner -v .

  # The sidecar runs on every desktop OS; its protocol and the setup paths are
  # where platforms differ, so the tests run on Windows and macOS too.
  test-other-platforms:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run test:python

  bandit:
    name: Python security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check the suppressed Hugging Face revision remains immutable
        run: |
          python3 - <<'PYCODE'
          import ast, re
          from pathlib import Path
          tree = ast.parse(Path("engine/src/edge_voice_engine/server.py").read_text())
          values = [n.value for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "MLX_REVISION" for t in n.targets)]
          if len(values) != 1 or not isinstance(values[0], ast.Constant) or not isinstance(values[0].value, str) or not re.fullmatch(r"[0-9a-f]{40}", values[0].value):
              raise SystemExit("MLX_REVISION must remain a full immutable commit SHA")
          PYCODE
      - name: Scan every Python file in engine and scripts
        run: |
          mkdir -p .scratch
          uvx --python 3.12 bandit==1.8.6 -r engine scripts -f json -o .scratch/bandit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bandit-report
          path: .scratch/bandit.json
          if-no-files-found: error
