name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0 # no moving major tags after v7
      - run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run typecheck
      - name: Lint (Obsidian review rules)
        run: bun run lint
      - name: Formatting
        run: bun run format:check
      - name: Tests
        run: bun run test
      - name: Python tests
        run: bun run test:python
      - name: Build
        run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: |
            main.js
            manifest.json
            styles.css

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${GITLEAKS_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "${asset}" gitleaks
      - name: Scan every commit
        run: ./gitleaks git --redact --no-banner -v .

  # The sidecar runs on every desktop OS; its protocol and the setup paths are
  # where platforms differ, so the tests run on Windows and macOS too.
  test-other-platforms:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0 # no moving major tags after v7
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run test:python
