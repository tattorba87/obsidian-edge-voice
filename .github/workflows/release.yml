name: Release

# A manual run validates the build and Obsidian gate without publishing.
# Only the final job can write; it consumes the named artifact from this run.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      run-obsidian:
        description: Run the Obsidian gate (disable only for a repeated artifact-only validation)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  obsidian:
    if: github.event_name != 'workflow_dispatch' || inputs.run-obsidian
    uses: ./.github/workflows/obsidian.yml

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - name: Check the tag matches the manifest
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match manifest.json version $version" >&2
            exit 1
          fi
      - name: Prepare release notes
        run: |
          awk -v v="${GITHUB_REF_NAME}" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf '%s\n' 'See CHANGELOG.md' > release-notes.md
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          if-no-files-found: error
          path: |
            main.js
            manifest.json
            styles.css
            release-notes.md

  verify-artifact:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Match publish's same-run download without a checkout or write token.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      - name: List and check the release files without executing them
        run: |
          ls -lh release-files/
          for file in main.js manifest.json styles.css release-notes.md; do
            test -s "release-files/$file"
          done

  publish:
    needs: [build, obsidian]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout or execution of built code. Without run-id/github-token,
      # download-artifact reads only artifacts from the current workflow run.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-files/main.js release-files/manifest.json release-files/styles.css \
            --verify-tag --draft --title "${GITHUB_REF_NAME}" --notes-file release-files/release-notes.md
