name: Release

# Pushing a version tag (from `bun run release x.y.z`) builds the plugin and drafts
# a GitHub release with the three files Obsidian installs. Check the draft,
# then publish it.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0 # no moving major tags after v7
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - name: Check the tag matches the manifest
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match manifest.json version $version" >&2
            exit 1
          fi
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME}" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md)
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
            --draft --title "${GITHUB_REF_NAME}" --notes "${notes:-See CHANGELOG.md}"
