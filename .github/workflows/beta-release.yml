name: BRAT beta release

on:
  push:
    branches: [experiment/english-dictation]
  workflow_dispatch:
    inputs:
      version:
        description: Beta version matching the branch base version
        type: string
        required: true
        default: 0.2.0-beta.1
      publish:
        description: Publish the checked assets as an opt-in prerelease
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: bun install --frozen-lockfile
      - run: uv run --no-project --python 3.12 --with pip-audit==2.10.1 scripts/audit-dependencies.py --release
      - run: bun run check
      - id: package
        name: Build BRAT assets without editing source versions
        env:
          BETA_VERSION: ${{ inputs.version || '0.2.0-beta.1' }}
        run: |
          bun run package:beta "$BETA_VERSION"
          echo "version=$BETA_VERSION" >> "$GITHUB_OUTPUT"
          mkdir beta-release
          cp ".scratch/beta/$BETA_VERSION/"* beta-release/
          (cd beta-release && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brat-beta
          path: beta-release/
          if-no-files-found: error

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: brat-beta
          path: beta-release
      - name: Attest beta plugin files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            beta-release/main.js
            beta-release/manifest.json
            beta-release/styles.css
      - name: Publish an opt-in prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BETA_VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd beta-release
          sha256sum -c SHA256SUMS
          gh release create "$BETA_VERSION" main.js manifest.json styles.css LICENSE SHA256SUMS \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "$BETA_VERSION" --notes-file BETA-NOTES.md
