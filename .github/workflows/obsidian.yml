name: Obsidian

# The tests against real Obsidian (tests/obsidian): a sandbox Obsidian, with
# the plugin built from this commit and a fake engine, driven through
# obsidian-cli. They catch what the unit tests can't, such as Obsidian's own
# internals or styles changing under the plugin. macOS runner minutes are
# costly while the repository is private, so this runs before each release
# (the release workflow calls it) and by hand from the Actions tab.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  # The version Steven runs. Checked against the SHA-256 of Obsidian's published installer.
  OBSIDIAN_VERSION: 1.14.5
  OBSIDIAN_SHA256: be79e6410d80fa705218aa4e8cb24ce8418cf16e13be4036227a5659b1f6aab2

jobs:
  obsidian:
    name: Real Obsidian (macOS)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Install Obsidian
        run: |
          dmg="Obsidian-${OBSIDIAN_VERSION}.dmg"
          curl -fsSLO "https://github.com/obsidianmd/obsidian-releases/releases/download/v${OBSIDIAN_VERSION}/${dmg}"
          echo "${OBSIDIAN_SHA256}  ${dmg}" | shasum -a 256 -c -
          hdiutil attach -nobrowse -quiet -mountpoint /Volumes/Obsidian "$dmg"
          cp -R /Volumes/Obsidian/Obsidian.app /Applications/
          hdiutil detach -quiet /Volumes/Obsidian
      - run: bun run test:obsidian
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: obsidian-tests
          path: |
            .sandbox-test/last.png
            .sandbox-test/requests.log
          if-no-files-found: ignore
