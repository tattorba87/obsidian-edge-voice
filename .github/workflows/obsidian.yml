name: Obsidian

# The tests against real Obsidian (tests/obsidian): a sandbox Obsidian, with
# the plugin built from this commit and a fake engine, driven through
# obsidian-cli. They catch what the unit tests can't, such as Obsidian's own
# internals or styles changing under the plugin. It runs before each release
# (the release workflow calls it), by hand from the Actions tab, and on the
# 1st of each month against both the pinned Obsidian and the newest release,
# so an Obsidian update that breaks the plugin shows up before people report it.
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:
    inputs:
      obsidian:
        description: "Obsidian to test: the pinned version or the newest release"
        type: choice
        options: [pinned, latest]
        default: pinned
  workflow_call:

permissions:
  contents: read

env:
  # The version Steven runs. Checked against the SHA-256 of Obsidian's published installer.
  OBSIDIAN_VERSION: 1.14.5
  OBSIDIAN_SHA256: be79e6410d80fa705218aa4e8cb24ce8418cf16e13be4036227a5659b1f6aab2

jobs:
  obsidian:
    name: Real Obsidian (macOS, ${{ matrix.obsidian }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # The monthly run tests both; a release and a manual run test one (pinned by default).
        obsidian: ${{ fromJSON(github.event_name == 'schedule' && '["pinned","latest"]' || format('["{0}"]', inputs.obsidian || 'pinned')) }}
    # Room for a retried test (vitest.obsidian.config.mts); a normal run takes about 2 minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Choose the newest Obsidian release
        if: matrix.obsidian == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        # The newest non-prerelease, checked against the SHA-256 GitHub records for its installer.
        run: |
          release=$(gh api repos/obsidianmd/obsidian-releases/releases/latest)
          version=$(jq -r '.tag_name | ltrimstr("v")' <<<"$release")
          digest=$(jq -r --arg n "Obsidian-${version}.dmg" '.assets[] | select(.name == $n) | .digest | ltrimstr("sha256:")' <<<"$release")
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ && "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "No usable installer in $version"; exit 1; }
          echo "OBSIDIAN_VERSION=$version" >> "$GITHUB_ENV"
          echo "OBSIDIAN_SHA256=$digest" >> "$GITHUB_ENV"
          echo "Testing Obsidian $version (pinned: ${OBSIDIAN_VERSION})" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Obsidian
        run: |
          dmg="Obsidian-${OBSIDIAN_VERSION}.dmg"
          curl -fsSLO "https://github.com/obsidianmd/obsidian-releases/releases/download/v${OBSIDIAN_VERSION}/${dmg}"
          echo "${OBSIDIAN_SHA256}  ${dmg}" | shasum -a 256 -c -
          hdiutil attach -nobrowse -quiet -mountpoint /Volumes/Obsidian "$dmg"
          cp -R /Volumes/Obsidian/Obsidian.app /Applications/
          hdiutil detach -quiet /Volumes/Obsidian
      - run: bun run test:obsidian
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: obsidian-tests-${{ matrix.obsidian }}
          path: |
            .sandbox-test/last.png
            .sandbox-test/requests.log
          if-no-files-found: ignore
