name: Engine install

# Setup installs the engine from a lock per platform (locks/, written by
# scripts/lock-engine.sh) with --require-hashes. Nobody can try every platform
# by hand, so this installs each lock on its own platform, as setup does, and
# loads the engine's native library, which is where a wrong build fails.
on:
  pull_request:
    paths:
      - locks/**
      - src/setup.ts
      - scripts/lock-engine.sh
      - .github/workflows/engine-install.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Install (${{ matrix.lock }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lock: linux-x64, runner: ubuntu-latest }
          - { lock: linux-arm64, runner: ubuntu-24.04-arm }
          - { lock: win32-x64, runner: windows-latest }
          - { lock: darwin-x64, runner: macos-15-intel, wheel: x86_64 }
          - { lock: darwin-arm64, runner: macos-15, wheel: arm64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Fetch the Mac wheel built here
        if: matrix.wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download moonshine-voice-0.1.5 -p "*_${{ matrix.wheel }}.whl" -D files
      - name: Install from the lock, every package checked against its hash
        run: |
          mkdir -p files
          uv venv -q --python 3.12 venv
          python=venv/bin/python
          [ -x "$python" ] || python=venv/Scripts/python.exe
          echo "PYTHON=$python" >> "$GITHUB_ENV"
          uv pip install --python "$python" --require-hashes --find-links files -r "locks/${{ matrix.lock }}.txt"
      - name: Load the engine
        run: |
          "$PYTHON" -I -c "import importlib.metadata as m; print('moonshine-voice', m.version('moonshine-voice'))"
          "$PYTHON" -I -c "from moonshine_voice.moonshine_api import _MoonshineLib; _MoonshineLib(); print('native library loads')"
