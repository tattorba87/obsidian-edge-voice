name: Engine wheels

# Builds the moonshine-voice wheels PyPI doesn't carry: Intel Macs have none,
# and the Apple Silicon one needs macOS 15. Both are built from a moonshine
# release for macOS 13.4, the floor of the ONNX Runtime it bundles, and
# attached to a release here (moonshine-voice-<version>) that the plugin's
# setup downloads from. Copy the checksums from that release's notes into
# moonshine.macWheels in engine/pins.json.
on:
  workflow_dispatch:
    inputs:
      moonshine-ref:
        description: moonshine tag to build (match the PyPI version setup installs elsewhere)
        default: v0.1.5
        required: true
      moonshine-sha:
        description: Reviewed full commit SHA that the Moonshine tag must resolve to
        type: string
        required: true
      publish:
        description: Publish the built wheels as a release (leave off for validation)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.4"
      # The wheel is tagged with the higher of the target above and the macOS the
      # build's Python was made for; the runner's Homebrew Python says 15. uv's own
      # Python builds are made for older macOS, so the tag follows the target.
      UV_PYTHON: "3.12"
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: moonshine-ai/moonshine
          ref: refs/tags/${{ inputs.moonshine-ref }}
      - name: Verify the reviewed Moonshine commit before running its code
        env:
          MOONSHINE_REF: ${{ inputs.moonshine-ref }}
          MOONSHINE_SHA: ${{ inputs.moonshine-sha }}
        run: |
          git check-ref-format "refs/tags/${MOONSHINE_REF}"
          if ! [[ "$MOONSHINE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Expected a full 40-character Moonshine commit SHA" >&2
            exit 1
          fi
          expected=$(printf '%s' "$MOONSHINE_SHA" | tr 'A-F' 'a-f')
          actual=$(git rev-parse "refs/tags/${MOONSHINE_REF}^{commit}")
          if [ "$actual" != "$expected" ] || [ "$(git rev-parse HEAD)" != "$expected" ]; then
            echo "Moonshine tag ${MOONSHINE_REF} resolves to ${actual}, not ${expected}" >&2
            exit 1
          fi
      # Only the LFS files a macOS build reads; the rest (Android, iOS, wasm) are hundreds of MB.
      - run: git lfs pull --include "core/cpp-annote/**,core/moonshine-tts/**,core/third-party/onnxruntime/lib/macos/${{ matrix.arch }}/**"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: scripts/build-pip.sh
      - name: Check the wheel installs and its library loads on this processor
        working-directory: language-bindings/python
        run: |
          wheel=$(ls dist/moonshine_voice-*.whl)
          case "$wheel" in *"-macosx_13_0_${{ matrix.arch }}.whl") ;; *) echo "Unexpected wheel: $wheel" >&2; exit 1 ;; esac
          uv venv --python 3.12 check
          uv pip install --python check/bin/python "$wheel"
          check/bin/python -I -c "from moonshine_voice.moonshine_api import _MoonshineLib; _MoonshineLib()"
          for lib in check/lib/python3.12/site-packages/moonshine_voice/*.dylib; do
            minos=$(otool -l "$lib" | awk '/LC_BUILD_VERSION/ {f=1} f && /minos/ {print $2; exit}')
            echo "$lib: macOS $minos"
            [ "$(printf '%s\n' "$minos" "$MACOSX_DEPLOYMENT_TARGET" | sort -V | tail -1)" = "$MACOSX_DEPLOYMENT_TARGET" ] || exit 1
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.arch }}
          path: language-bindings/python/dist/moonshine_voice-*.whl
          if-no-files-found: error

  release:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Through the environment, never pasted into the script, so the input can't run as shell.
          MOONSHINE_REF: ${{ inputs.moonshine-ref }}
          MOONSHINE_SHA: ${{ inputs.moonshine-sha }}
        run: |
          version=$(ls moonshine_voice-*.whl | head -1 | cut -d- -f2)
          sha256sum moonshine_voice-*.whl > SHA256SUMS
          notes=$(printf 'moonshine-voice %s built from moonshine tag %s, commit %s, for macOS 13.4 and later.\n\n```\n%s\n```\n' \
            "$version" "$MOONSHINE_REF" "$MOONSHINE_SHA" "$(cat SHA256SUMS)")
          # Not marked latest, so it never stands in for a plugin release.
          gh release create "moonshine-voice-${version}" moonshine_voice-*.whl SHA256SUMS \
            --title "moonshine-voice ${version} for macOS" --notes "$notes" --latest=false
