name: Engine release

# Builds an engine release (scripts/build-engine-release.sh) and, only when
# "publish" is ticked, publishes it as engine-<version>, with the version
# from engine/pyproject.toml. Its notes carry the install commands and the
# files' checksums. The Engine package workflow tests the same build first.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (otherwise build and check only)
        type: boolean
        default: false
      prerelease:
        description: Mark a published engine as a prerelease for beta testing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Enforce the release advisory policy
        run: uv run --no-project --python 3.12 --with pip-audit==2.10.1 scripts/audit-dependencies.py --release
      - name: Preserve the advisory gate report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-release-advisories
          path: .scratch/security-audit/
          if-no-files-found: error
      - id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"$/\1/p' engine/pyproject.toml)" >> "$GITHUB_OUTPUT"
      - name: Build the release's files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/engine-${VERSION}"
          # The steps Edge Voice shows point at this release; it must be the one being built.
          grep -q "export const ENGINE_VERSION = \"${VERSION}\";" src/engine.ts
          scripts/build-engine-release.sh release "$base"
          {
            echo "The Edge Voice speech engine ${VERSION}. Edge Voice shows these steps when it can't find the engine; they're here too. First install uv (https://docs.astral.sh/uv/getting-started/installation/), then run the lines for your computer, in order. Every package is checked against the hash in the requirements file the second line names; read that file first if you like."
            echo
            for target in "darwin arm64 false Mac (Apple silicon)" "darwin arm64 true Mac (Apple silicon, with the faster engine; macOS 14 or later)" "darwin x64 false Mac (Intel)" "linux x64 false Linux (x64)" "linux arm64 false Linux (ARM)" "win32 x64 false Windows (PowerShell)" "win32 arm64 false Windows on ARM (PowerShell)"; do
              set -- $target
              platform=$1 arch=$2 faster=$3
              shift 3
              echo "**$*:**"
              echo "After installing the engine, choose either or both optional downloads: voices get for TTS, models get for English STT. Medium prioritizes accuracy; Small/Tiny prioritize speed with more recognition errors."
              echo '```'
              bun scripts/setup-steps.ts "$platform" "$arch" "$faster" kokoro_af_bella "" medium | python3 -I -c "import json, sys; print('\n'.join(json.load(sys.stdin)))"
              echo '```'
            done
            echo
            echo "The macOS moonshine-voice wheels are built by this repository and contain ONNX Runtime and other open-source libraries; their licences are in THIRD-PARTY-NOTICES.txt."
            echo
            echo "SHA-256 of the files:"
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } > release/release-notes.md
          cat release/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-release
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # No checkout or execution of built code; only this run's artifact.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-release
          path: release
      # What this workflow built. The macOS moonshine-voice wheels come from the
      # Engine wheels workflow, which attests them itself.
      - name: Attest the files built here
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/edge_voice_engine-*.whl
            release/docopt-*.whl
            release/requirements-*.txt
            release/THIRD-PARTY-NOTICES.txt
      - name: Publish engine-${{ needs.build.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          cd release
          sha256sum -c SHA256SUMS
          flags=()
          if [ "$RELEASE_PRERELEASE" = true ]; then flags+=(--prerelease); fi
          # Not marked latest, so it never stands in for a plugin release. Fails if the tag exists.
          gh release create "engine-${VERSION}" ./*.whl ./requirements-*.txt THIRD-PARTY-NOTICES.txt SHA256SUMS \
            --title "Speech engine ${VERSION}" --notes-file release-notes.md --latest=false --target "$GITHUB_SHA" "${flags[@]}"
