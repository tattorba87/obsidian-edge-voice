# Python tooling for server.py, the speech sidecar. The plugin itself is
# TypeScript (package.json); this file only configures ruff and pytest.
[project]
name = "edge-voice-sidecar"
version = "0.1.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
